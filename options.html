<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Pengaturan Ekstensi Print ID</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 10px;
        max-width: 600px;
      }
      label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
      }
      input[type='text'] {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        box-sizing: border-box;
      }
      button {
        margin-top: 15px;
        padding: 8px 15px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.7;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #ffffff;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        animation: rotation 1s linear infinite;
      }
      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .status {
        margin-top: 10px;
        color: green;
      }
      .section {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .section h2 {
        margin-top: 0;
        font-size: 16px;
      }
      .model-status {
        margin-top: 10px;
        padding: 10px;
        border-radius: 5px;
      }
      .model-status.success {
        background-color: #d4edda;
        color: #155724;
      }
      .model-status.error {
        background-color: #f8d7da;
        color: #721c24;
      }
      .model-status.warning {
        background-color: #fff3cd;
        color: #856404;
      }
      .help-text {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
      }
      .required-label::after {
        content: '*';
        color: #d32f2f;
        margin-left: 4px;
      }
      input.invalid {
        border-color: #d32f2f;
        background-color: #fff8f8;
      }
      input.invalid:focus {
        outline-color: #d32f2f;
      }
      .error-message {
        color: #d32f2f;
        font-size: 12px;
        margin-top: 4px;
        display: none;
      }
      .error-message.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Pengaturan Ekstensi Print ID</h1>

    <div class="section">
      <h2>[Puskesmas] Pengaturan j-care</h2>

      <label for="jcareUrl" class="required-label">URL j-care:</label>
      <input
        type="text"
        id="jcareUrl"
        name="jcareUrl"
        placeholder="Contoh: http://192.168.100.178/j-care/"
        aria-required="true"
        aria-describedby="jcareUrlError"
        autocomplete="url"
      />
      <div id="jcareUrlError" class="error-message" role="alert">URL j-care wajib diisi</div>

      <label for="puskesmasName" class="required-label">Nama Puskesmas:</label>
      <input
        type="text"
        id="puskesmasName"
        name="puskesmasName"
        placeholder="Contoh: PKM Jayengan"
        aria-required="true"
        aria-describedby="puskesmasNameError"
        autocomplete="organization"
      />
      <div id="puskesmasNameError" class="error-message" role="alert">
        Nama Puskesmas wajib diisi
      </div>
    </div>

    <div class="section">
      <h2>[CAPTCHA] Pengaturan CAPTCHA Solver</h2>

      <label for="modelPath">Path Model ONNX:</label>
      <input
        type="text"
        id="modelPath"
        name="modelPath"
        placeholder="Kosongkan untuk default (extension/captcha-model/)"
      />
      <div class="help-text">Model CTC end-to-end: captcha_ctc.onnx (CNN + Conv1D)</div>

      <button id="testModels">Test Model</button>
      <div id="modelStatus" class="model-status" style="display: none"></div>
    </div>

    <button id="save">Simpan Pengaturan</button>
    <div id="status" class="status"></div>

    <script src="domHelpers.js"></script>
    <script src="options.js"></script>
  </body>
</html>
